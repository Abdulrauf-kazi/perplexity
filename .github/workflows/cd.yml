name: CD

# Builds the backend Docker image and pushes it to GitHub Container Registry.

on:
  # Start when CI finishes on main, so untested code is never packaged.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write # needed to push the image

env:
  # The exact commit CI tested. github.sha could be a newer commit on main.
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-backend:
    # CI also runs on pull requests, so only continue for a successful push to main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # GHCR image names must be lowercase.
          tags: ghcr.io/abdulrauf-kazi/perplexity-backend:${{ env.COMMIT_SHA }}
          build-args: GIT_SHA=${{ env.COMMIT_SHA }}
          # Reuse unchanged layers from earlier runs to speed up builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
